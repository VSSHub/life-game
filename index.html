          return 'Four seconds is a very long time to be the only vertical object in a room. Two people see it, and by Sunday nine know, because information here does not need a carrier. It is honest, and honesty is worth the fee. Watch the second thing, though: there is a small clean pleasure in the standing that has nothing to do with truth, and if you keep going you will eventually be able to feel it coming — the sacrament of not kneeling, with its own small congregation, meeting weekly.';
        },
      },
      {
        text: 'Afterward, ask ' + c.host.first + ' what they were actually praying about.',
        verb: 'investigate', cost: 1,
        fx: G => {
          LIFE.E.applyFx({ axes: { empathy: 5, aware: 3, certainty: -2 },
            npcs: { [c.host.id]: { t: 6, r: 5, mem: 'They asked what I had been praying for. Not whether it works. What it was. I told them about my brother. I had not said his name out loud in a year.' } } });
          return 'You catch them by the coffee urn and ask the plain question, and the answer is not doctrine. It is a brother, or a bill, or a scan on Thursday — a specific thing with a date on it. They talk for six minutes and you say almost nothing. Nothing about the metaphysics moves an inch in either direction, and you leave knowing something about a person that no argument about the metaphysics would ever have handed you.';
        },
      },
      {
        text: 'Ask the organizers for a moment of silence instead.',
        verb: 'speak',
        when: () => grown(),
        lockHint: 'Nobody hands the microphone to somebody your age.',
        fx: G => {
          LIFE.E.applyFx({ axes: { autonomy: 3, influence: 2, aware: 2, trust: -2, certainty: 2 },
            npcs: { [c.host.id]: { t: -2, r: 5, mem: 'They wanted my prayer swapped for a silence. They called it neutral. There is no neutral; there is whose turn it is. We are still arguing about it and I like arguing with them.' } },
            flags: { askedForSilence: true } });
          return 'You make the case in the parking lot beforehand: same sixty seconds, everybody uses it however they use it, nobody is excluded. It is a good argument and it half-works — you get the silence at this one and the prayer back at the next. ' + c.host.name + ' takes it personally, and is not entirely wrong to: a silence is not the absence of a frame, it is a different frame, and the people who have had the microphone for a hundred and forty years can be forgiven for noticing the difference before you admit it.';
        },
      },
    ],
  });
  add({
    id: 'cross-the-dry-side', stages: ['teen', 'young', 'adult', 'middle'],
    weight: 3, repeatable: true,
    lensAffinity: ['systems', 'conductor'],
    cast: { other: 'any' },
    title: 'The Number on the Counter',
    base: (G, c) => 'It is face-up on the break-room table and you read it before you decide to. A cannery stub, second '
      + 'shift, two weeks: sixty-eight hours at $11.40 — thirty-four a week, which is six under the line where benefits '
      + 'start, which is not an accident anybody had to arrange this month. Seven hundred and three dollars and '
      + 'forty-four cents. In the margin, in pencil, somebody has done arithmetic the way you do a crossword: '
      + 'water 118, car 240, Tues. And you know whose it is, and you know the house, on the low side of Fry Road where '
      + 'the sidewalk stops mid-block for no reason anyone has ever explained. ' + c.other.name + ' comes back in for '
      + 'their jacket while you are still holding it.',
    overlays: {
      providence: 'You were raised to help the person in front of you and never once taught to ask why they keep arriving in front of you at the same rate every year.',
      conductor: 'The sidewalk stops at the same place the 1962 map stopped. Nobody alive drew that line and everybody alive is standing on one side of it.',
      systems: 'Thirty-four hours is a designed number. So is the flood premium on a sixty-one-thousand-dollar house, and so is which streets got poured. None of it required a villain — only a series of reasonable meetings, each with minutes, each adjourned by five.',
      cynic: 'The town will hold a fundraiser with a bake sale and a raffle and clear four hundred dollars, which is fifty-six hours of this.',
      open: 'The number is not a symbol of anything. It is a number, attached to a Tuesday, attached to a person now standing in the doorway watching you hold it.',
    },
    choices: (G, c) => [
      {
        text: 'Say the number out loud somewhere it is inconvenient.',
        verb: 'confront',
        fx: G => {
          LIFE.E.applyFx({ axes: { account: 4, aware: 3, influence: 1, trust: -2, harm: 2 },
            npcs: { [c.other.id]: { t: -3, r: 6, mem: 'They read my check out at a meeting. They meant it kindly and they did not ask me. For three months I was a number that people in this town had opinions about.' } },
            flags: { saidTheNumber: true } });
          return 'You put it in front of the council, or the deacons, or the shift manager who has a manager, and the room does not dispute it, which is the thing you did not prepare for. Nobody says it is wrong. Two people say it is complicated and one of them is telling the truth. The number is now public and so, to about forty people, is whose number it is — and ' + c.other.name + ' spends the spring being asked how they are doing in a tone they can hear coming from across a parking lot.';
        },
      },
      {
        text: 'Fix the one thing in front of you. Pay the water bill.',
        verb: 'build', cost: 1,
        fx: G => {
          LIFE.E.applyFx({ axes: { empathy: 3, trust: 2, compet: 1, aware: -1 },
            npcs: { [c.other.id]: { t: 5, r: 4, mem: 'They paid it. I was glad and I hated it, in that order, about four seconds apart, and both of those were real and I could not say either one out loud.' } } });
          return 'A hundred and eighteen dollars and the pressure comes back on the low side by Thursday. It is instant, it is real, and it is measurable, which is three things the structural version will never be. It also converts a neighbor into a person who owes you, permanently and without a mechanism for repayment, and it leaves every arrangement that produced the bill exactly where it was, ready for August.';
        },
      },
      {
        text: 'Ask them what would actually help, then do that instead of what you assumed.',
        verb: 'investigate', cost: 1,
        fx: G => {
          LIFE.E.applyFx({ axes: { empathy: 4, aware: 4, compet: 2, certainty: -2 },
            npcs: { [c.other.id]: { t: 7, r: 5, mem: 'They asked me what I needed instead of deciding. It was not money. It was somebody to sit on hold with the county for two hours, and they did it, and they did not tell anybody they did it.' } } });
          return 'The answer is not money and it is not dramatic. It is a ride on Thursdays because the car is a maybe. It is two hours on hold with a county office that closes at four, which is when everybody who needs it is still at work — a schedule that is not malice and functions exactly like it. You do the boring thing. It fixes about eleven percent of the problem and it is the eleven percent they picked.';
        },
      },
      {
        text: 'Put it back face-down. It was not yours to read.',
        verb: 'ignore',
        fx: G => {
          LIFE.E.applyFx({ axes: { coherence: 1, aware: -1, distract: 1 },
            npcs: { [c.other.id]: { t: 1, mem: 'They put it back down and never mentioned it. That was decent of them. I would have done the same and I would still have wanted them to say something.' } } });
          return 'You turn it over and step back and say something about the weather, and the dignity argument is sound: a person’s arithmetic is theirs, and being made into someone else’s moral occasion is its own injury. Hold that next to the other thing, though. Privacy is the exact mechanism by which the number stays a private problem, ninety-four hundred times over, in a town where everybody assumes they are the only one doing pencil math in a margin.';
        },
      },
    ],
  });
  add({
    id: 'cross-the-far-disaster', stages: ['teen', 'young', 'adult', 'middle'],
    weight: 2, repeatable: true,
    cast: { faithful: 'believer', loud: 'media' },
    title: 'Eight Thousand Miles',
    base: (G, c) => 'It happens at ten past three in the morning our time, most of a world away, and by the time you are '
      + 'awake the number has a comma in it. By noon the comma has moved. The town starts metabolizing it before '
      + 'lunch: the marquee out front changes, the phone tree runs, and ' + c.faithful.name + ' has a prayer chain '
      + 'going by nine with forty names on it. ' + c.loud.name + ' posts a version that is somehow about here. A '
      + 'collection jar raises eleven hundred and forty dollars and then hosts a two-week argument about which agency '
      + 'gets it. The flag at the school goes to half for this one. It did not go to half in March, and nobody in the '
      + 'building can tell you the rule.',
    overlays: {
      providence: 'The chain will run all week and the people on it are not performing. Prayer is what they have been given for a distance they cannot cross, and they are using it at full effort, at six in the morning, out loud, alone in their kitchens.',
      conductor: 'Watch which disasters get the marquee and which get a sentence. This town has a rule it has never written down and could not defend if you made it try, and it is not the only town.',
      systems: 'Attention is allocated by resemblance, not by scale — the whole architecture runs on it and it is upstream of anybody’s virtue. Note the second thing too: being able to describe that mechanism is not itself a form of help, and it feels remarkably like one.',
      cynic: 'Grief into content by Thursday, content into nothing by Sunday, and the town will have felt something, which is what it came for.',
      open: 'Both hold: the response is shaped by television, disproportionate, and slightly about us — and eleven hundred and forty dollars out of a town that is itself broke is not a small number, and neither is forty people awake at six.',
    },
    choices: (G, c) => [
      {
        text: 'Give, quietly, to the least photogenic organization on the list.',
        verb: 'build',
        fx: G => {
          LIFE.E.applyFx({ axes: { account: 3, empathy: 2, compet: 1 },
            npcs: { [c.faithful.id]: { t: 4, r: 3, mem: 'They gave and did not sign the board. I only know because I count it. That is the kind of thing I keep a private list of.' } } });
          return 'You look up which outfit has been in that region for eleven years and has no photographs of children on its front page, and you send what you can, and nobody knows. It is the most defensible thing available and it is genuinely small — a rounding error against the comma. What it is not is theater, and the reason that matters is not moral: undirected money arrives late and buys what somebody else already had, and directed money buys a generator.';
        },
      },
      {
        text: 'Post about it.',
        verb: 'speak',
        fx: G => {
          LIFE.E.applyFx({ axes: { influence: 2, distract: 3, empathy: -1 },
            post: { topic: 'the disaster, eight thousand miles off', frame: 'nuance' },
            npcs: { [c.loud.id]: { t: 3, mem: 'They posted. Good post, actually. It ran two days behind mine and got a fifth of the reach, which is the whole business in one sentence.' } } });
          return 'You write something true and you write it well, and the feeling of pressing post is a specific feeling that has no name and deserves one: relief, discharge, a sense of having been counted present. Two hundred people see it. Nothing moves eight thousand miles. The honest part is that it was not nothing — a few people felt less alone in the horror — and the honest part is also that you cannot tell how much of it was that.';
        },
      },
      {
        text: 'Say out loud that the town’s response is theater.',
        verb: 'confront',
        fx: G => {
          LIFE.E.applyFx({ axes: { certainty: 4, aware: 2, empathy: -4, trust: -3, harm: 2 },
            npcs: { [c.faithful.id]: { t: -6, mem: 'They called the prayer chain theater in front of my mother. My mother had been up since four calling people. I remember exactly which word they used and I remember the room.' } } });
          return 'You are right about the marquee, right about the flag, right about the argument over the agency. You say it in a room where a woman has been dialing since four in the morning because it is the only motor she owns, and the accuracy of the observation and the effect of the observation turn out to be entirely unrelated quantities. Nobody defends the marquee. They just stop talking around you, and the chain runs anyway, and you have made the week fractionally worse in the only place your hands could reach.';
        },
      },
      {
        text: 'Nothing. Go to work.',
        verb: 'ignore',
        fx: G => {
          LIFE.E.applyFx({ axes: { coherence: 2, distract: -2, empathy: -1 } });
          return 'You put the phone in a drawer and do your job, and the honest defense is strong: your hands are eleven miles from anything they could move, grief you cannot act on metabolizes into a numbness you will need later, and the feed is engineered to convert your horror into somebody’s quarter. Hold it up against the other thing, though. The same reasoning is sitting right there, fully assembled, for the water bill on Fry Road, and it will be available every single time you want it.';
        },
      },
      {
        text: 'Use whatever room you have to route the money somewhere it can actually land.',
        verb: 'cooperate',
        when: G => G.axes.influence >= 40,
        lockHint: 'You do not have a room to speak to. Nobody is waiting on your recommendation.',
        fx: G => {
          LIFE.E.applyFx({ axes: { compet: 3, influence: 2, account: 2, trust: 2 },
            npcs: { [c.faithful.id]: { t: 5, r: 4, mem: 'They ended the two-week argument in nine minutes with a phone number and a name. The money went out on a Monday instead of never. I have used their method three times since.' } } });
          return 'You spend an evening making calls until you find an organization with people on the ground and a bank account that can receive a wire, and you bring the name and the number to the argument, and the argument ends because arguments end when somebody arrives with logistics. The money goes out on a Monday. You have also just made yourself the person who does this, forever, which is how every unpaid job in this town has ever been filled.';
        },
      },
    ],
  });
  add({
    id: 'cross-the-healing-claim', stages: ['teen', 'young', 'adult', 'middle'],
    weight: 3, repeatable: true,
    lensAffinity: ['wonder', 'systems', 'open'],
    cast: { claimant: 'believer', doubter: 'skeptic' },
    title: 'Something Got Better',
    base: (G, c) => 'She has not needed the cane since April. That is the claim and it is not really in dispute — you '
      + 'watched her come up the porch steps carrying a pie, and in February she could not get up them at all. '
      + c.claimant.name + ' tells it plainly, without embroidery: eleven people in a living room in March, oil on a '
      + 'thumb, hands on her shoulders, and the words. They also mention, in the same untroubled breath, that a '
      + 'neurologist in Carbondale changed a dosage in February, which they consider a detail. The March imaging is in '
      + 'a hospital system that has since merged twice. Across the kitchen, ' + c.doubter.name + ' has the whole '
      + 'explanation assembled and is waiting for a gap in the sentence.',
    overlays: {
      providence: 'This room has prayed for a hundred things that did not move — cancers, marriages, a boy in 2004. That history is not an argument against this one. It is why they are crying about it.',
      wonder: 'A woman who could not manage her own steps in February walked into this kitchen with a pie. The event is real and undisputed. The event is not its explanation, and the pull to make those the same thing is the strongest force in the room and it is pulling on you too.',
      systems: 'Three candidate causes, one changed dosage six weeks prior, zero retrievable records, and a hundred percent of the reporting done by people who love her. Also worth pricing: nothing here is falsifiable in either direction, which cuts both ways and is generally only noticed cutting one.',
      cynic: 'Somebody will be selling the oil by Christmas. Not her — she is the last person who would. Somebody.',
      open: 'You are permitted to hold all of it: something got better, nobody knows why, and the not-knowing is the honest end of the sentence rather than a slot reserved for the answer you already prefer.',
    },
    choices: (G, c) => [
      {
        text: 'Offer to help her get the records. Actually offer — rides, forms, phone calls.',
        verb: 'investigate', cost: 1,
        fx: G => {
          LIFE.E.applyFx({ axes: { aware: 4, empathy: 4, compet: 2, certainty: -3 },
            npcs: { [c.claimant.id]: { t: 6, r: 6, mem: 'They were the only person who wanted to know what happened to me instead of what it meant. We still do not know. I have the folder in the drawer and it is mine.' },
                    [c.doubter.id]: { t: 2, r: 3, mem: 'They actually went and looked, which is more than I did. I had already decided. I do not love what that says.' } },
            flags: { chasedTheRecords: true } });
          return 'She says yes immediately, which surprises you, and it takes four months. The Carbondale office has the February note. The March imaging went to a system that merged and the release form comes back rejected twice for a middle initial. What you finally assemble is partial, real, and does not settle anything: the dosage change is documented, the timeline is compatible with three stories, and the one measurement that would have discriminated between them was never taken because nobody knew to take it. She keeps the folder. It is the only honest object in the whole affair.';
        },
      },
      {
        text: 'Say the dosage out loud, to the room.',
        verb: 'confront',
        fx: G => {
          LIFE.E.applyFx({ axes: { certainty: 4, autonomy: 2, empathy: -4, trust: -3, harm: 2 },
            npcs: { [c.claimant.id]: { t: -6, r: 5, mem: 'They said the word placebo in my kitchen while I was standing up in it. I know what a dosage is. I was there for every hour of all of it and they were there for none.' },
                    [c.doubter.id]: { t: 4, mem: 'Finally somebody in this town said the obvious thing out loud. I bought them a coffee. They looked like they wanted to be somewhere else.' } } });
          return 'You name the confound, correctly, in a kitchen. It is true that the confound exists. It is also true that you cannot demonstrate it did the work, and that you have just used the language of evidence to deliver a verdict evidence does not support. ' + c.doubter.name + ' is delighted with you, and the fact that you can feel how good that feels is the part worth writing down.';
        },
      },
      {
        text: 'Say nothing. Be glad with her. It is her knee.',
        verb: 'cooperate',
        fx: G => {
          LIFE.E.applyFx({ axes: { empathy: 4, trust: 3, aware: -1, harm: 1 },
            npcs: { [c.claimant.id]: { t: 6, mem: 'They just sat there and were glad with me. Out of thirty people, they were the only one who managed only that, and it is the thing I think about.' } } });
          return 'You eat the pie and you are glad, uncomplicatedly, for one hour, and it is the correct thing to do in that kitchen at that moment and you would do it again. The story leaves the house at seven. By August it has lost the neurologist entirely — the version that travels never keeps the six sentences that complicate it — and somebody in another county who has never met her stops taking something. That is not your doing. It is downstream of a silence you chose, which is a different thing and not a nothing.';
        },
      },
      {
        text: 'Ask ' + c.doubter.first + ', privately, what evidence would actually change their mind.',
        verb: 'investigate',
        fx: G => {
          LIFE.E.applyFx({ axes: { aware: 5, autonomy: 3, certainty: -3, fluid: 3 },
            npcs: { [c.doubter.id]: { t: -1, r: 6, mem: 'They asked me what would change my mind and then waited. I gave them three answers. The first two were not real and we both heard it. I have not been asked that since and I have not stopped answering it.' } },
            flags: { auditedTheSkeptic: true } });
          return 'In the driveway, you ask the question the other direction: what would it take. They start fast — controls, imaging, a registry — and then slow down, because they can hear themselves specifying conditions that have never once been met for anything and would not be met for this either. "Nothing available," they finally say, and look annoyed at having said it. It is the same architecture you have spent your life pointing at in the other building. It just has better vocabulary and a worse view of itself.';
        },
      },
    ],
  });
  add({
    id: 'cross-the-turn', stages: ['young', 'adult', 'middle', 'elder'],
    weight: 2, repeatable: true,
    lensAffinity: ['open', 'systems'],
    cast: { turner: 'any', keeper: 'any' },
    title: 'The Cost of Turning',
    base: (G, c) => 'It comes at the end of a meeting that was about something else, in the flat voice people use when '
      + 'they have written it down beforehand. ' + c.turner.name + ' says they were wrong. Not softly, not with an '
      + 'escape hatch — wrong for eleven years, loudly, in print, and here is what changed it, and here are the two '
      + 'people they owe, one of whom is in the room. Three full seconds of nothing. Then somebody makes a joke to get '
      + 'the temperature down. Within a week ' + c.keeper.name + ' has stopped sitting with them, the Wednesday '
      + 'carpool has quietly rerouted, and a thread runs thirty-one comments in which people who agreed with them for a '
      + 'decade explain that they always had reservations.',
    overlays: {
      providence: 'Repentance is the most praised act in this town and the least survivable. Every pulpit teaches it. No committee has ever protected anybody who did it.',
      conductor: 'People have turned here before. The ones who turned early paid the most, and are the entire reason anyone was able to turn late.',
      systems: 'A group holds together by making exit expensive. You are watching the price get assessed in real time, by twelve people who would each individually and sincerely deny assessing anything.',
      cynic: 'Everyone loves a convert right up until they have to sit next to one at a fish fry.',
      open: 'Both wings will now tell you the same thing in different vocabularies: that a mind which changed once cannot be relied on. It is the only proposition the two of them share.',
    },
    choices: (G, c) => [
      {
        text: 'Say publicly, that day, that you respect it.',
        verb: 'speak',
        fx: G => {
          LIFE.E.applyFx(FX.stand(c.turner, 'Somebody said out loud that it took something. That week, in that room. I have never repaid it and I do not think I can.'));
          LIFE.E.applyFx({ axes: { account: 3, aware: 2, influence: -2, trust: -2 },
            npcs: { [c.keeper.id]: { t: -4, mem: 'They spoke up for the one who turned. Fine. Noted. I know now which way they would go, which is useful information to have early.' } },
            flags: { backedTheTurn: true } });
          return 'You say it plainly — that it took something, that you have seen a hundred people not do it — and the room absorbs it the way rooms absorb things they did not order. You pay on both sides: ' + c.keeper.name + ' files you, and the people who were right about this all along file you too, for having praised the arrival instead of the journey. What you have actually done is lower the price of the next turn by a few dollars, for somebody who is not in the room yet.';
        },
      },
      {
        text: 'Take the win. Remind everyone you said this in 2011.',
        verb: 'confront',
        fx: G => {
          LIFE.E.applyFx({ axes: { certainty: 4, influence: 2, empathy: -4, entrench: 2 },
            npcs: { [c.turner.id]: { t: -5, mem: 'The first thing I heard after the hardest sentence of my life was somebody keeping score. I did not change back. I did stop saying things out loud, and that was the year I started.' } } });
          return 'It is accurate, it is satisfying, and it is delivered in about nine words. The room laughs, a little. What it costs is not measured in this room — it is measured in the four people watching who were also privately most of the way turned, and who have just been shown, at no charge, precisely what the reception looks like. Being right in public has an interest rate and it is charged to the next person.';
        },
      },
      {
        text: 'Say nothing in the room. Call them that night.',
        verb: 'repair', cost: 1,
        fx: G => {
          LIFE.E.applyFx({ axes: { empathy: 4, account: 2, coherence: -1 },
            npcs: { [c.turner.id]: { t: 5, r: 5, mem: 'They called that night and stayed on for an hour. It was the only call I got. They also did not say a word in the room, and I know both of those things, and I keep them in the same pocket.' } } });
          return 'An hour on the phone with somebody who is discovering the shape of their new week. You are useful, specifically and immediately, in a way public praise is not. And you have kept the entire cost private, which means they carry the public part alone while you carry none of it, and they are decent enough not to say so and observant enough to have noticed.';
        },
      },
      {
        text: 'Wait. See whether it holds.',
        verb: 'investigate',
        fx: G => {
          LIFE.E.applyFx({ axes: { aware: 2, coherence: 1, empathy: -2 },
            npcs: { [c.turner.id]: { t: -2, mem: 'A lot of people were watching to see if I meant it. Watching is not the same as being anywhere I could see. That first month I was counting, and I could not help it.' } } });
          return 'The reasoning is sound and you have watched it be sound before: sincerity is claimed constantly, holds rarely, and a public endorsement of a turn that reverses in March costs you something you will need. So you watch, carefully and fairly, for eleven weeks. It does hold. By the time you say anything, the week that would have mattered is four months gone, and support that arrives after the danger is not support, it is agreement.';
        },
      },
    ],
  });
  add({
    id: 'cross-both-partly-right', stages: ['young', 'adult', 'middle', 'elder'],
    weight: 3, repeatable: true,
    cast: { one: 'any', two: 'any' },
    title: 'Somebody Has To Be Wrong',
    base: (G, c) => 'It is a sign-in sheet. That is the entire object. ' + c.one.name + ' runs the pantry intake and '
      + 'needs names on it, because the grant renewal wants a served-households number and the grant is fourteen '
      + 'thousand dollars, which is four months of shelf. ' + c.two.name + ' says the sheet is why four families '
      + 'stopped coming in March, and can name all four, and is not guessing. It has been to two meetings. Somewhere '
      + 'between the first and the second it stopped being about a sheet. Both of them have now caught you in the '
      + 'parking lot separately, which is where this town does its actual governance, and both have said some version '
      + 'of: you see it, right?',
    overlays: {
      providence: 'Both of these people are here on a Saturday, unpaid, for people who will never thank them. Whatever else it is, this is a fight between two of the four who show up.',
      conductor: 'Paperwork has been a shield and a net in this county depending entirely on whose hand was on the pen, and both of them know a specific family who learned that the hard way.',
      systems: 'Two hard constraints, one form, no slack anywhere. It is a procedural problem that will be converted into a values problem by Thursday, because positions on values are cheaper to hold and much easier to repeat.',
      cynic: 'One sheet of paper, eleven weeks, and a friendship. The sheet stopped being the subject at the second meeting and nobody has told the sheet.',
      open: 'Each is right about their own half and wrong about the other’s. The town does not want the synthesis; a synthesis cannot be carried home and repeated at a kitchen table.',
    },
    choices: (G, c) => [
      {
        text: 'Back ' + c.one.name + '. Without the grant there is no shelf to be scared of.',
        verb: 'speak',
        fx: G => {
          LIFE.E.applyFx({ axes: { compet: 2, influence: 2, empathy: -2, certainty: 2 },

    }
  }
  function setFieldView(mode, npcId, G) {
    LIFE.FIELD.setView(mode, npcId, G);
    if (use3D && LIFE.FIELD3D) LIFE.FIELD3D.setView(mode, npcId, G);
  }
  function enterPerspective(npcId) {
    perspective = npcId;
    setFieldView('other', npcId, LIFE.E.G);
    UI.render();
  }
  function exitPerspective() {
    perspective = null;
    setFieldView('self', null, LIFE.E.G);
    UI.render();
  }
  UI.exitPerspective = exitPerspective;
  function perspectivePanel(G, scene) {
    const w = LIFE.W.npcs[perspective], st = G.npcs[perspective];
    const lens = LIFE.FIELD.lensOf(perspective);
    let reading = '';
    if (scene && scene.overlays) {
      const o = scene.overlays[lens];
      reading = typeof o === 'function' ? o(G) : (o || '');
    }
    const mem = st.mem.slice(-3).map(m => '<li><span>' + m.year + '</span> ' + m.text + '</li>').join('');
    return '<div class="persp">'
      + '<p class="kicker">standing inside</p>'
      + '<h2>' + w.name + '</h2>'
      + '<p class="persp-role">' + w.role + ' · lens: <em>' + LIFE.T.lenses[lens].name + '</em></p>'
      + '<div class="prose">' + P(w.desc) + '</div>'
      + (reading ? '<div class="overlay-block"><span class="overlay-tag">this moment, from in here</span>'
          + '<div data-voice="npc:' + perspective + '">' + P(reading) + '</div></div>' : '')
      + '<h3 class="persp-h">What they hold about you</h3>'
      + (mem ? '<ul class="persp-mem" data-voice="npc:' + perspective + '">' + mem + '</ul>'
             : '<p class="persp-none">Nothing specific. You have not yet been an event in their life.</p>')
      + '<p class="persp-note">You can see why they see it this way. That is not the same as agreeing, '
      + 'and it settles nothing you owe them.</p>'
      + '<button class="btn" id="btn-back">Return to your own field</button></div>';
  }
  function titleScreen() {
    const hasSave = !!store.get('life-slice-save-v1');
    app.innerHTML = '<div class="screen title-screen">'
      + '<p class="kicker">a consciousness &amp; civilization simulator — vertical slice</p>'
      + '<h1 class="game-title">L I F E</h1>'
      + '<p class="epigraph">Every person experiences a different version of the same world.<br>You are about to inherit one of them.</p>'
      + '<div class="warnings"><h3>Before you begin</h3>'
      + '<p>This life contains: religious conditioning and religious doubt; a natural disaster; grief and the death of loved ones; social exclusion; and one accounting, at the end, that does not flatter. Nothing here rewards contempt for any person.</p></div>'
      + '<div class="a11y"><label><input type="checkbox" id="opt-big"> Larger text</label>'
      + '<label><input type="checkbox" id="opt-contrast"> High contrast</label>'
      + '<label><input type="checkbox" id="opt-motion"> Reduce motion</label></div>'
      + '<div class="seed-row"><label for="seed">Seed <span class="seed-hint">(a world; leave blank for a new one)</span></label>'
      + '<input id="seed" type="text" placeholder="e.g. marrow-levee-441" autocomplete="off"></div>'
      + '<div class="title-buttons">'
      + (hasSave ? '<button class="btn btn-primary" id="btn-continue">Continue the life</button>' : '')
      + '<button class="btn" id="btn-new">' + (hasSave ? 'Begin a different life' : 'Be born') + '</button>'
      + '</div>'
      + '<p class="footnote">You will not choose your starting conditions. Nobody does.</p>'
      + voiceBar()
      + '</div>';
    ['big', 'contrast', 'motion'].forEach(k => {
      const box = document.getElementById('opt-' + k);
      box.checked = store.get('life-a11y-' + k) === '1';
      applyA11y(k, box.checked);
      box.addEventListener('change', () => {
        store.set('life-a11y-' + k, box.checked ? '1' : '0');
        applyA11y(k, box.checked);
      });
    });
    const cont = document.getElementById('btn-continue');
    if (cont) cont.addEventListener('click', () => {
      if (LIFE.E.load()) { mode = LIFE.E.G.lastAfter ? 'aftermath' : 'node'; UI.render(); }
    });
    document.getElementById('btn-new').addEventListener('click', () => {
      LIFE.E.wipe();
      LIFE.E.newGame(document.getElementById('seed').value);
      mode = 'node'; montageStep = 0; perspective = null;
      UI.render();
    });
  }
  function applyA11y(k, on) {
    const cls = { big: 'big-text', contrast: 'high-contrast', motion: 'reduced-motion' }[k];
    document.documentElement.classList.toggle(cls, on);
  }
  function originScreen(G) {
    const O = LIFE.W.origins[G.origin];
    app.innerHTML = '<div class="screen origin-screen">'
      + '<p class="kicker">the conditions you did not choose</p>'
      + '<h2>' + O.title + '</h2>'
      + P(O.blurb) + '<div class="origin-jo">' + P(O.jo) + '</div>'
      + '<p class="seed-echo">world-seed: <code>' + esc(G.seed) + '</code> — the same town, replayed from another birth, is a different world.</p>'
      + '<button class="btn btn-primary" id="btn-go">Begin</button></div>';
    document.getElementById('btn-go').addEventListener('click', () => { LIFE.E.next(); UI.render(); });
  }
  function introScreen(G, ch) {
    app.innerHTML = rail(G, ch)
      + '<div class="screen intro-screen">'
      + '<p class="ch-num">Chapter ' + ch.num + '</p><h2>' + ch.title + '</h2>'
      + '<p class="ch-age">Age ' + ch.age + ' — ' + ch.year + '</p>'
      + '<div class="prose">' + P(typeof ch.intro === 'function' ? ch.intro(G) : ch.intro) + '</div>'
      + '<button class="btn btn-primary" id="btn-go">Go on</button></div>';
    document.getElementById('btn-go').addEventListener('click', () => { LIFE.E.next(); UI.render(); });
  }
  function choiceButtons(G, choices, container, isBetween) {
    const waived = LIFE.E.costsWaived(choices);
    const anyAffordable = !waived;
    if (waived) {
      container.appendChild(el('<p class="empty-note">You are running on empty. '
        + 'What you do now, you do tired — and it still counts.</p>'));
    }
    choices.forEach(c => {
      const visible = !c.when || c.when(G) || c.lockHint;
      if (!visible) return;
      const locked = c.when && !c.when(G);
      const broke = anyAffordable && c.cost && G.att < c.cost;
      const btn = el('<button class="choice' + ((locked || broke) ? ' locked' : '') + '">'
        + '<span class="verb">' + (c.verb || 'act') + (c.cost ? ' · ' + '●'.repeat(c.cost) : '') + '</span>'
        + '<span class="choice-text">' + c.text + '</span>'
        + (locked ? '<span class="lock-hint">' + c.lockHint + '</span>'
          : broke ? '<span class="lock-hint">You do not have the attention left for this.</span>' : '')
        + '</button>');
      if (!locked && !broke) btn.addEventListener('click', () => {
        LIFE.E.choose(c);
        if (isBetween || !LIFE.E.G.lastAfter) { LIFE.E.next(); UI.render(); }
        else { mode = 'aftermath'; UI.render(); }
      });
      container.appendChild(btn);
    });
  }
  function sceneScreen(G, node) {
    const scene = node.scene;
    const r = LIFE.E.renderScene(scene);
    const lens = LIFE.T.lenses[G.lens];
    let html = rail(G, node.ch) + '<div class="layout"><main class="screen scene-screen">'
      + '<h2 class="scene-title">' + scene.title + '</h2>'
      + '<div class="prose" data-voice="narrator">' + P(r.base) + '</div>';
    if (r.overlay) {
      html += '<div class="overlay-block"><span class="overlay-tag">through the ' + lens.name + ' lens</span>'
        + '<div data-voice="lens">' + P(r.overlay) + '</div></div>';
    }
    html += '<div class="ev-slot"></div><div class="choices"></div></main>' + weatherPanel(G) + '</div>';
    if (perspective) {
      html = rail(G, node.ch) + '<div class="layout"><main class="screen">'
        + perspectivePanel(G, scene) + '</main>' + weatherPanel(G) + '</div>';
    }
    app.innerHTML = html;
    if (perspective) {
      document.getElementById('btn-back').addEventListener('click', exitPerspective);
      syncField(G);
      return;
    }
    if (scene.evidence && scene.evidence.length) {
      const known = scene.evidence.filter(e => G.evidence.indexOf(e.id || e) >= 0);
      void known;
    }
    const evIds = G.evidence;
    if (evIds.length) {
      const slot = app.querySelector('.ev-slot');
      const drawer = el('<details class="evidence"><summary>What you can actually check (' + evIds.length + ')</summary></details>');
      evIds.forEach(id => {
        const e = LIFE.W.evidenceCatalog[id];
        if (e) drawer.appendChild(el('<div class="ev-item"><h4>' + e.label + '</h4><p>' + e.text + '</p></div>'));
      });
      slot.appendChild(drawer);
    }
    choiceButtons(G, scene.choices, app.querySelector('.choices'), false);
    syncField(G);
  }
  function aftermathScreen(G, node) {
    app.innerHTML = rail(G, node.ch) + '<div class="layout"><main class="screen aftermath-screen">'
      + '<p class="kicker">what followed</p>'
      + '<div class="prose aftermath" data-voice="aftermath">' + P(G.lastAfter) + '</div>'
      + '<button class="btn btn-primary" id="btn-go">Go on</button></main>' + weatherPanel(G) + '</div>';
    document.getElementById('btn-go').addEventListener('click', () => {
      mode = 'node'; LIFE.E.next(); UI.render();
    });
    syncField(G);
  }
  function betweenScreen(G, ch) {
    const b = ch.between;
    app.innerHTML = '<div class="screen between-screen">'
      + '<p class="between-tag">— the Between —</p>'
      + '<h2>' + b.title + '</h2>'
      + '<div class="prose between-prose" data-voice="between">' + P(typeof b.text === 'function' ? b.text(G) : b.text) + '</div>'
      + '<div class="choices choices-between"></div>' + voiceBar() + '</div>';
    choiceButtons(G, b.choices, app.querySelector('.choices'), true);
  }
  function montageScreen(G) {
    const lines = LIFE.LEGACY.montage(G);
    const shown = lines.slice(0, montageStep + 1);
    app.innerHTML = '<div class="screen montage-screen">'
      + '<p class="kicker">the years after</p>'
      + '<div class="prose">' + shown.map(l => '<p class="montage-line">' + l + '</p>').join('') + '</div>'
      + '<button class="btn btn-primary" id="btn-go">' + (montageStep + 1 < lines.length ? 'And then' : 'And then, at last') + '</button></div>';
    document.getElementById('btn-go').addEventListener('click', () => {
      if (montageStep + 1 < lines.length) { montageStep++; UI.render(); }
      else { LIFE.E.next(); UI.render(); }
    });
  }
  function deathScreen(G) {
    app.innerHTML = '<div class="screen death-screen">'
      + '<div class="prose between-prose">' + P(LIFE.LEGACY.death(G)) + '</div>'
      + '<button class="btn btn-primary" id="btn-go">What remains</button></div>';
    document.getElementById('btn-go').addEventListener('click', () => { LIFE.E.next(); UI.render(); });
  }
  function legacyScreen(G) {
    const secs = LIFE.LEGACY.reflect(G);
    const eps = LIFE.LEGACY.epilogues(G);
    let html = '<div class="screen legacy-screen">'
      + '<p class="kicker">the consciousness &amp; legacy reflection</p>'
      + '<h1 class="legacy-title">One Life, Accounted</h1>'
      + '<p class="legacy-sub">' + LIFE.W.origins[G.origin].title + ' · ' + LIFE.W.origins[G.origin].birthYear + '–' + (LIFE.W.origins[G.origin].birthYear + G.deathAge) + ' · seed <code>' + esc(G.seed) + '</code></p>'
      + '<section class="arc-sec"><h3>The Shape of It</h3>'
      + '<canvas id="arc" aria-label="Your life drawn as a band: colour is the lens you saw through, height is how wide your perceivable world was, the dark bar inside is the cage of inherited certainty, dots are people close and gone cold, red ticks are harm you were carrying."></canvas>'
      + '<p class="arc-key"><span class="k-band">band colour</span> the lens you saw through · '
      + '<span class="k-h">height</span> how much world you could take in · '
      + '<span class="k-cage">dark bar</span> the cage of inherited certainty · '
      + '<span class="k-warm">dots above</span> people close · '
      + '<span class="k-cold">dots below</span> accounts gone cold · '
      + '<span class="k-harm">red ticks</span> harm carried</p></section>';
    secs.forEach(s => { html += '<section class="legacy-sec"><h3>' + s.title + '</h3>'
      + '<div data-voice="legacy">' + P(s.body) + '</div></section>'; });
    html += '<section class="legacy-sec"><h3>The Others — Every Life, Accounted</h3><div class="epilogues">';
    eps.forEach(e => { html += '<div class="ep"><h4>' + e.name + '</h4><p>' + e.text + '</p></div>'; });
    html += '</div></section>';
    html += '<section class="legacy-final"><p>' + LIFE.LEGACY.finalQuestion() + '</p></section>';
    html += voiceBar();
    html += '<div class="title-buttons"><button class="btn btn-primary" id="btn-again">Live again — same world, different birth</button>'
      + '<button class="btn" id="btn-fresh">A new world entirely</button></div></div>';
    app.innerHTML = html;
    LIFE.FIELD.drawArc(document.getElementById('arc'), G);
    document.getElementById('btn-again').addEventListener('click', () => {
      const seed = G.seed; LIFE.E.wipe(); LIFE.E.newGame(seed + '+'); montageStep = 0; mode = 'node'; UI.render();
    });
    document.getElementById('btn-fresh').addEventListener('click', () => {
      LIFE.E.wipe(); montageStep = 0; mode = 'node'; UI.render();
    });
  }
  function devOverlay() {
    if (document.getElementById('dev-toggle')) return;
    const btn = el('<button id="dev-toggle" title="Developer view — the hidden state the player never sees in ordinary play">◉</button>');
    const panel = el('<div id="dev-panel" hidden><h3>The Answer Sheet <span>(developer view — the four layers beneath the experience)</span></h3><pre id="dev-pre"></pre></div>');
    document.body.appendChild(btn);
    document.body.appendChild(panel);
    btn.addEventListener('click', () => {
      panel.hidden = !panel.hidden;
      if (!panel.hidden && LIFE.E.G) {
        const G = LIFE.E.G;
        const npcTable = {};
        Object.keys(G.npcs).forEach(id => { npcTable[id] = 'trust ' + G.npcs[id].trust + ' / respect ' + G.npcs[id].respect + ' / memories ' + G.npcs[id].mem.length; });
        document.getElementById('dev-pre').textContent = JSON.stringify({
          seed: G.seed, origin: G.origin, lens: G.lens,
          'HIDDEN TRUTHS (never shown in play)': G.hidden,
          axes: G.axes, attention: G.att + '/' + G.attMax,
          media: { reach: G.media.reach, distortion: G.media.distortion, posts: G.media.posts.length },
          flags: G.flags, evidence: G.evidence, npcs: npcTable,
          accountability: G.accountLog,
        }, null, 2);
      }
    });
  }
  function after(result) {
    wireVoice();
    LIFE.VOICE.readScreen();
    return result;
  }
  UI.render = function () {
    app = document.getElementById('app');
    const G = LIFE.E.G;
    LIFE.VOICE.stop();            // never let the previous screen talk over this one
    devOverlay();
    if (!G) { setLensTint(null); return after(titleScreen()); }
    setLensTint(G);
    if (mode === 'aftermath' && G.lastAfter) return after(aftermathScreen(G, LIFE.E.node()));
    mode = 'node';
    const node = LIFE.E.node();
    if (node.kind !== 'scene' && perspective) {
      perspective = null;
      setFieldView('self', null, G);
    }
    document.documentElement.classList.toggle('in-between', node.kind === 'between' || node.kind === 'death');
    if (node.kind === 'origin') return after(originScreen(G));
    if (node.kind === 'intro') return after(introScreen(G, node.ch));
    if (node.kind === 'scene') return after(sceneScreen(G, node));
    if (node.kind === 'between') return after(betweenScreen(G, node.ch));
    if (node.kind === 'montage') return after(montageScreen(G));
    if (node.kind === 'death') return after(deathScreen(G));
    if (node.kind === 'legacy') return after(legacyScreen(G));
  };
  return UI;
})();

(function () {
  function boot() {
    LIFE.E.G = null;
    LIFE.VOICE.restore();     // remember the reading-aloud preference
    LIFE.UI.render();
  }
  if (document.readyState === 'loading') window.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
</body>
</html>
